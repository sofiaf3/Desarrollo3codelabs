# ── Servidor HTTP ─────────────────────────────────────────────────────────────
server.port=8080

# ── Version de la API ─────────────────────────────────────────────────────────
api.version=v1

# ── Conexion a PostgreSQL ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/curso_springboot
spring.datasource.username=devdb
spring.datasource.password=a1b2c3d4
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# create-drop: crea las tablas al iniciar, las borra al apagar
spring.jpa.hibernate.ddl-auto=create-drop

# Muestra el SQL que genera Hibernate en la consola (util para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Lee import.sql como UTF-8 (evita tildes corruptas en Windows)
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8

# ── Spring Boot Actuator ──────────────────────────────────────────────────────
# Los endpoints de administracion se sirven en un puerto separado
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

# ── Paginacion ────────────────────────────────────────────────────────────────
# Serializa Page<T> como { content: [...], page: { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto
